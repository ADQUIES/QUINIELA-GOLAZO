<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUINIELA GOLAZO</title>
<style>
body{background:#0f3d2e;margin:0;font-family:Arial;color:white;text-align:center;padding:10px}
h1{color:#e6ff00;font-size:32px;letter-spacing:2px;text-shadow:2px 2px 0 #000}
.contenedor{background:white;color:black;width:100%;max-width:550px;margin:0 auto;border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:#222;color:#e6ff00;padding:10px 5px;font-size:14px}
td{border:1px solid #999;padding:6px 2px;font-size:13px;font-weight:bold}
.sel{display:inline-block;width:30px;height:30px;line-height:30px;border:1.5px solid #000;cursor:pointer;background:#eee}
.sel.active{background:#00ff66}
#nombre{margin:15px 0;padding:12px;width:85%;max-width:400px;border:2px solid #000;border-radius:5px;font-size:16px}
#btnEnviar{background:#e6ff00;color:black;border:3px solid #000;padding:12px 30px;font-weight:bold;font-size:18px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<h1>QUINIELA GOLAZO</h1>
<div class="contenedor">
<table id="tabla"><tr><th>LOCAL</th><th>L</th><th>E</th><th>V</th><th>VISITA</th></tr></table>
</div>
<input id="nombre" placeholder="Nombre del participante"><br>
<button id="btnEnviar" onclick="enviar()">Enviar 0</button>
<p id="msg" style="color:#e6ff00"></p>
<script>
const URL_SHEET = "https://script.google.com/macros/s/AKfycbwgXtYL5IP0SDbc2mKGXau7q9tPJ7SNCLIBAosM_HhkRg1q7YhyfYygSWYmnTxOUZ5I-w/exec";
const partidos = [["PUEBLA","JUAREZ"],["NECAXA","MAZATLAN"],["TIJUANA","TIGRES"],["MONTERREY","SAN LUIS"],["QUERETARO","TOLUCA"],["LEON","ATLAS"],["CRUZ AZUL","PACHUCA"],["SANTOS","AMERICA"],["ATLETICO","CHIVAS"]];
let picks = Array(9).fill("");
function render(){let t=document.getElementById("tabla");partidos.forEach((p,i)=>{let tr=document.createElement("tr");tr.innerHTML=`<td>${p[0]}</td><td><div class="sel" id="L${i}" onclick="sel(${i},'L')">L</div></td><td><div class="sel" id="E${i}" onclick="sel(${i},'E')">E</div></td><td><div class="sel" id="V${i}" onclick="sel(${i},'V')">V</div></td><td>${p[1]}</td>`;t.appendChild(tr);});}
function sel(i,l){picks[i]=l;document.getElementById("L"+i).classList.remove("active");document.getElementById("E"+i).classList.remove("active");document.getElementById("V"+i).classList.remove("active");document.getElementById(l+i).classList.add("active");document.getElementById("btnEnviar").innerText="Enviar "+picks.filter(x=>x!="").length;}
async function enviar(){const nombre=document.getElementById("nombre").value.trim();if(!nombre){alert("Escribe tu nombre");return;}if(picks.includes("")){alert("Selecciona los 9 partidos");return;}document.getElementById("btnEnviar").disabled=true;document.getElementById("btnEnviar").innerText="Enviando...";const datos={nombre:nombre,p1:picks[0],p2:picks[1],p3:picks[2],p4:picks[3],p5:picks[4],p6:picks[5],p7:picks[6],p8:picks[7],p9:picks[8]};await fetch(URL_SHEET,{method:"POST",mode:"no-cors",body:JSON.stringify(datos)});document.getElementById("msg").innerText="¡Listo "+nombre+"! Guardado en BASEDEDATOS";document.getElementById("nombre").value="";picks=Array(9).fill("");document.querySelectorAll(".sel").forEach(e=>e.classList.remove("active"));document.getElementById("btnEnviar").innerText="Enviar 0";document.getElementById("btnEnviar").disabled=false;}
render();
</script>
</body>
</html>
