<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela Golazo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#001525;display:flex;justify-content:center;font-family:Arial Black}
.contenedor{width:100%;max-width:480px;background:#001525;border:3px solid #d4ff00}
.header{background:#fff;display:flex;align-items:center;gap:8px;padding:8px}
.header img{width:48px;height:48px;border-radius:50%;border:2px solid #d4ff00}
.header h1{font-size:20px;color:#b8a600;text-shadow:1px 1px 0 #000}
.premio{background:#0a344a;color:#fff;text-align:center;padding:8px;font-family:Arial;font-weight:bold;font-size:12px;border-top:2px solid #d4ff00;border-bottom:2px solid #d4ff00}
#lista-partidos{background:#fff;width:100%}
.encabezado{display:flex;background:#0a344a;color:#d4ff00;font-family:Arial;font-size:10px;text-align:center;padding:4px 0}
.encabezado div{flex:1}
.encabezado div:nth-child(1){max-width:50px}
.encabezado div:nth-child(3), .encabezado div:nth-child(4), .encabezado div:nth-child(5){max-width:38px}
.encabezado div:nth-child(7){max-width:50px}
.fila{display:flex;align-items:center;border-bottom:1px solid #000;min-height:46px;background:#fff;width:100%}
.fila:nth-child(even){background:#d9e8f0}
.fila .n{flex:1;font-size:8.5px;line-height:9px;padding:2px;overflow:hidden}
.fila .e{max-width:50px;width:100%;height:46px;display:flex;align-items:center;justify-content:center;background:#fff;border-left:1px solid #ddd;border-right:1px solid #ddd}
.fila .e img{width:26px;height:22px;object-fit:contain}
.fila .b{max-width:38px;width:100%;display:flex;justify-content:center}
.fila .b button{width:28px;height:26px;background:#fff;border:1.5px solid #000;border-radius:5px;font-size:11px;font-weight:bold}
.fila .b button.active{background:#e50000;color:#fff}
.formulario{padding:10px;background:#001525}
.formulario input, .formulario textarea{width:100%;padding:12px;margin-bottom:8px;border-radius:8px;border:2px solid #000;font-family:Arial}
.fila-form{display:flex;gap:6px}
#numQuinielas{max-width:65px;text-align:center}
.btn{flex:1;padding:12px;border-radius:8px;border:2px solid #000;font-family:Arial Black;font-weight:bold}
.btn-g{background:#d4ff00}
.btn-w{background:#25d366;color:#fff}
.btn-s{background:#007bff;color:#fff}
</style>
</head>
<body>
<div class="contenedor">
  <div class="header"><img src="img/logo.png"><h1>QUINIELA GOLAZO</h1></div>
  <div class="premio">$700 PRIMER LUGAR | $15 POR QUINIELA</div>
  <div id="lista-partidos"></div>
  <div class="formulario">
    <input id="nombre" placeholder="NOMBRE">
    <input id="telefono" placeholder="WHATSAPP">
    <div class="fila-form">
      <input id="numQuinielas" type="number" value="1" min="1">
      <button class="btn btn-g" onclick="generar()">GENERAR</button>
    </div>
    <textarea id="resultado" rows="5"></textarea>
    <p id="infoCosto" style="color:#d4ff00;font-family:Arial;font-weight:bold"></p>
    <div class="fila-form">
      <button class="btn btn-w" onclick="enviarWhatsApp()">WHATSAPP</button>
      <button class="btn btn-s" onclick="guardarEnBase()">GUARDAR</button>
    </div>
    <p id="statusBase" style="color:white;font-family:Arial;font-size:12px"></p>
  </div>
</div>
<script src="java/main.js"></script>
</body>
</html>
