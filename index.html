<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela Golazo</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMuTFVnhxc_5BG-LHAKYz7agNn4Is2s8l07Snug1XtOfJS9NlWfd_C7OnVQHAR3qSlNQ/exec";</script>

<header class="top-header">
  <img src="img/logo3.png" class="logo">
  <div class="premio">$700 PRIMER LUGAR</div>
</header>

<div class="container">
  <div id="lista-partidos" class="partidos-box"><p style="text-align:center;padding:20px">Cargando partidos de Google Sheet ADMIN B3:K11...</p></div>

  <div class="form-box">
    <input id="nombre" placeholder="Tu nombre completo">
    <input id="telefono" placeholder="Teléfono WhatsApp (10 dígitos)">
    <input id="numQuinielas" type="number" min="1" value="1" placeholder="Cuántas quinielas?">
    <button class="btn-generar" onclick="generar()">GENERAR QUINIELAS</button>
  </div>

  <div class="result-box">
    <textarea id="resultado" rows="12" placeholder="Aquí aparecerán tus quinielas para copiar y pegar en WhatsApp..."></textarea>
    <p id="infoCosto"></p>
    <p id="infoIDs"></p>
    <button class="btn-whatsapp" onclick="enviarWhatsApp()">📲 ENVIAR POR WHATSAPP</button>
    <button class="btn-guardar" onclick="guardarEnBase()">💾 GUARDAR EN BASEDEDATOS</button>
    <p id="statusBase" style="text-align:center;font-weight:bold;color:#00ff88"></p>
  </div>
</div>

<script src="java/main.js"></script>
</body>
</html>
