<!DOCTYPE html>
<html lang="es-mx">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiniela Golazo</title>
<link rel="icon" href="img/logo.png">
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#0a2a4a;color:#fff}
.wrap{max-width:640px;margin:auto;padding:8px}
.top-banner{text-align:center;padding:10px 0;cursor:pointer}
.top-banner img{width:100%;max-height:160px;object-fit:contain}
.barra-k2{background:#0066cc;border:2px solid #ffee00;border-bottom:none;color:#ffee00;font-weight:900;text-align:center;padding:8px 6px;font-size:10px;text-transform:uppercase} /* J2 JUEGA SIN BOTON YA */
.barra-h4{background:#0066cc;border:2px solid #ffee00;border-top:none;color:#fff;font-weight:900;text-align:center;padding:8px 40px 8px 6px;font-size:14px;position:relative} /* JORNADA 30 AHORA CON position relative PARA ALINEAR LA X */
.match{display:grid;grid-template-columns:42px 78px 36px 34px 36px 78px 42px;align-items:center;background:#fff;color:#000;border-bottom:2px solid #000;min-height:50px}
.match:nth-child(even){background:#d7e8ef}
.team{font-weight:900;font-size:9.2px;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden}
.logo{width:32px;height:32px;object-fit:contain;margin:auto;display:block}
.btn-lev{width:34px;height:34px;border:2.2px solid #000;border-radius:8px;background:#fff;font-weight:900;cursor:pointer;margin:auto;display:grid;place-items:center}
.btn-lev.sel{background:#d4ff00}
.barra-abajo{background:#0066cc;border:2px solid #ffee00;border-top:none;display:flex;justify-content:space-between;padding:8px 10px;font-weight:900;font-size:15px}
.costo-fijo{color:#fff}
.costo-valor{color:#ffee00;margin-left:6px}
.cierre{color:#fff}
.line{color:#eaff00;font-weight:900;letter-spacing:6px;text-align:center;font-size:28px;margin:14px 0}
.inp{width:100%;padding:14px;border:none;border-radius:10px;font-weight:800;margin-top:8px;text-transform:uppercase}
.fila-agregar{display:grid;grid-template-columns:62px 1fr;gap:8px;margin-top:8px}
.b-trash{background:#ff0040;border:none;border-radius:10px;font-size:24px;cursor:pointer;min-height:48px}
.b-agregar{background:#d4ff00;border:none;border-radius:10px;font-weight:900;padding:14px;cursor:pointer;width:100%;font-size:16px}
.fila-enviar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.b-env{background:#2eff7a;border:none;border-radius:10px;padding:14px;font-weight:900;font-size:16px;cursor:pointer}
.b-suerte{background:#eaff00;border:none;border-radius:10px;padding:14px;font-weight:900;cursor:pointer;font-size:16px}
.caja-negra{background:#000;border:2px solid #fff;border-radius:12px;padding:10px;display:flex;justify-content:space-between;color:#00e5ff;font-weight:900;margin-top:10px}
.lista-box{background:#000;border:2px solid #fff;border-radius:12px;overflow:hidden;margin-top:10px}
.lista-head{background:#000;color:#00e5ff;text-align:center;padding:8px;font-weight:900}
.lista-content{background:#0e0e0e;max-height:300px;overflow:auto;padding:6px;font-size:16px}
.q-item{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:999;padding:15px}
.modal.show{display:grid}
.card-ok{background:#fff;color:#000;border-radius:16px;padding:18px;max-width:380px;width:100%;text-align:center}
.organizer-tags,.organizer-tagss{display:flex;gap:6px;margin:8px 0}
.organizer-tags a,.organizer-tagss a{flex:1;text-decoration:none}
.tag{border:2px solid #ffee00;background:#0e3a4e;border-radius:12px;padding:8px;text-align:center;font-weight:900;font-size:10px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px}
.tag img{width:28px;height:28px}
.tag.facebook{background:#1877F2;border-color:#fff}
.tag.pagar{background:#fff;color:#000}
/* BOTON X AHORA ALINEADO CON JORNADA 30 */
.boton-x-actual{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:36px;height:32px;background:#b0b0b0;border:2px solid #000;border-radius:6px;font-weight:900;font-size:16px;color:#000;display:grid;place-items:center;cursor:pointer;z-index:5}
</style>
</head>
<body>
<div id="modalOk" class="modal"><div id="cardOk" class="card-ok"></div></div>
<div class="wrap">
<div class="top-banner" id="bannerLogo"><img src="img/logo3.png"></div>

<div class="organizer-tags">
<a href="https://www.facebook.com/GolazoJuega/"><div class="tag facebook"><img src="./img/facebook-icon.svg"><span>Facebook</span></div></a>
<a href="combinaciones/combinaciones.html"><div class="tag"><img src="./img/combinaciones.png"><span>Combinaciones</span></div></a>
<a href="pagos/Pagos.html"><div class="tag pagar"><img src="./img/SPIN.png"><span>Pagar</span></div></a>
</div>
<div class="organizer-tagss">
<a href="cjugar/cjugarinst.html"><div class="tag"><img src="./img/cjugarimg.png"><span>Instrucciones</span></div></a>
<a href="reglamento/reglamento.html"><div class="tag"><img src="./img/reglamento.png"><span>Reglamento</span></div></a>
<a href="horarios/horarios.html"><div class="tag"><img src="./img/horarios.png"><span>Horarios</span></div></a>
</div>

<!-- BARRA J2 SIN BOTON -->
<div class="barra-k2" id="barraK2"><span id="txtK2">JUEGA DEL VIERNES 4 DE SEPTIEMBRE AL DOMINGO 7 DE SEPTIEMBRE</span></div>

<!-- BARRA H4 CON BOTON X ALINEADO HORIZONTALMENTE A JORNADA 30 -->
<div class="barra-h4" id="barraH4">
  <button class="boton-x-actual" onclick="limpiarActual()">X</button>
  <span id="txtH4">JORNADA 30</span>
</div>

<div id="partidos"></div>
<div class="barra-abajo"><div><span class="costo-fijo">COSTO</span><span class="costo-valor" id="txtO2"> $20</span></div><div class="cierre" id="txtI2">CIERRA VIERNES 3 PM</div></div>
<div class="line" id="linea">---------</div>
<input class="inp" id="nombre" placeholder="NOMBRE COMPLETO">
<input class="inp" id="tel" placeholder="TELEFONO / WHATSAPP">
<div class="fila-agregar">
  <button class="b-trash" onclick="borrarTodo()">🗑️</button>
  <button class="b-agregar" onclick="agregar()">AGREGAR +</button>
</div>
<div class="fila-enviar">
  <button class="b-env" onclick="enviarTodo()">Enviar <span id="nEnv">0</span> 📲</button>
  <button class="b-suerte" onclick="suerte()">🎲 A LA SUERTE</button>
</div>
<div class="caja-negra"><div>Costo: $<span id="costo">0</span><br><span id="nQ">0</span> Quiniela(s)</div><div>Total: $<span id="total">0</span></div></div>
<div class="lista-box"><div class="lista-head">Lista De Quinielas</div><div class="lista-content" id="lista"></div></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2MV9K-yXbOEfYTTT8M8OdsCVQuAe7iISrqm6Aw6BipcZxq5PYpVNy9vKmfi-3Gjd1/exec";
const MI_WHATSAPP = "524498476015";
let PARTIDOS=[["MÉXICO","BOLIVIA"],["COSTA RICA","URUGUAY"],["INGLATERRA","BOSNIA"],["ALEMANIA","UCRANIA"],["SUIZA","ESTONIA"],["IRLANDA","HUNGRÍA"],["ITALIA","TURQUÍA"],["DINAMARCA","SUECIA"],["MÉXICO","URUGUAY"]];
let picks=Array(9).fill("");
let quinielas=JSON.parse(localStorage.getItem("qs")||"[]");
let clicksLogo=0; let timerLogo;
document.getElementById("bannerLogo").addEventListener("click",()=>{clicksLogo++;clearTimeout(timerLogo);timerLogo=setTimeout(()=>{clicksLogo=0},2000);if(clicksLogo>=5){clicksLogo=0;window.open("panelcentral.html","_blank");}});

function getCosto(){
  let txt = document.getElementById("txtO2").textContent || "$20";
  let num = parseInt(txt.replace(/[^0-9]/g,"")) || 20;
  return num;
}

async function cargarAdmin(){
 try{
  let r=await fetch(SCRIPT_URL+"?action=obtener_admin&t="+Date.now());
  let j=await r.json();
  if(j.partidos && j.partidos.length>0) PARTIDOS=j.partidos.map(p=>[p.local,p.visita]);
  if(j.j2) document.getElementById("txtK2").textContent=j.j2.toUpperCase();
  else if(j.k2) document.getElementById("txtK2").textContent=j.k2.toUpperCase();
  if(j.h4) document.getElementById("txtH4").textContent=j.h4.toUpperCase();
  else if(j.h2) document.getElementById("txtH4").textContent=j.h2.toUpperCase();
  if(j.o2){document.getElementById("txtO2").textContent=j.o2.toString().toUpperCase().replace("COSTO","").trim();renderLista();}
  if(j.i2) document.getElementById("txtI2").textContent=j.i2.toUpperCase();
 }catch(e){}
 render();
}

function render(){
 let h="";PARTIDOS.forEach((p,i)=>{h+=`<div class="match"><button class="btn-lev ${picks[i]=='L'?'sel':''}" onclick="setP(${i},'L')">L</button><div class="team">${p[0]}</div><img class="logo" src="img/ESCUDOS/${p[0]}.PNG" onerror="this.style.visibility='hidden'"><button class="btn-lev ${picks[i]=='E'?'sel':''}" onclick="setP(${i},'E')">E</button><img class="logo" src="img/ESCUDOS/${p[1]}.PNG" onerror="this.style.visibility='hidden'"><div class="team">${p[1]}</div><button class="btn-lev ${picks[i]=='V'?'sel':''}" onclick="setP(${i},'V')">V</button></div>`;});document.getElementById("partidos").innerHTML=h;document.getElementById("linea").textContent=picks.map(v=>v||"-").join("");
}
function setP(i,v){picks[i]=v;render();}
function limpiarActual(){picks=Array(9).fill("");render();}
function suerte(){picks=picks.map(()=>["L","E","V"][Math.floor(Math.random()*3)]);render();}
function agregar(){
 if(picks.includes("")){alert("Selecciona los 9 partidos");return}
 let n=document.getElementById("nombre").value.trim().toUpperCase();
 let t=document.getElementById("tel").value.trim();
 if(!n||!t){alert("Pon nombre y telefono");return}
 quinielas.push({nombre:n,tel:t,comb:picks.join("")});
 localStorage.setItem("qs",JSON.stringify(quinielas));
 renderLista();
 picks=Array(9).fill("");render();
}
function renderLista(){
 let costoU = getCosto();
 let total = quinielas.length * costoU;
 document.getElementById("nEnv").textContent=quinielas.length;
 document.getElementById("nQ").textContent=quinielas.length;
 document.getElementById("costo").textContent=costoU;
 document.getElementById("total").textContent=total;
 document.getElementById("lista").innerHTML=quinielas.map((q,i)=>`<div class="q-item"><span>${i+1}. ${q.nombre} - ${q.comb}</span><span onclick="quinielas.splice(${i},1);localStorage.setItem('qs',JSON.stringify(quinielas));renderLista()" style="color:#ff0040;font-weight:900;cursor:pointer">X</span></div>`).join("")||"<center style='color:#666'>Sin quinielas</center>";
}
function borrarTodo(){if(confirm("¿Borrar todas?")){quinielas=[];localStorage.setItem("qs","[]");renderLista();}}
async function enviarTodo(){
 if(quinielas.length==0){alert("Agrega quinielas");return}
 let b=document.querySelector(".b-env");b.textContent="Enviando...";b.disabled=true;
 try{
  let r=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"guardar_quiniela",quinielas:quinielas})});
  let j=await r.json();
  document.getElementById("cardOk").innerHTML=`<h2>✅ ENVIADAS</h2><div style="background:#eaff00;border-radius:10px;padding:10px;font-weight:900">IDs: ${j.ids.join(", ")}<br>Total: $${j.total}</div><button onclick="cerrarModal()" style="background:#25D366;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900;width:100%;margin-top:10px">Cerrar</button>`;
  document.getElementById("modalOk").classList.add("show");
  window.open(`https://wa.me/${MI_WHATSAPP}?text=*NUEVA QUINIELA*%0A${quinielas[0].nombre}%0AIDs:${j.ids.join(",")}%0ATotal:$${j.total}`,"_blank");
 }catch(e){
  let costoU = getCosto();
  let total = quinielas.length * costoU;
  await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"guardar_quiniela",quinielas:quinielas})});
  document.getElementById("cardOk").innerHTML=`<h2>✅ ENVIADAS</h2><p>Total: $${total}</p><button onclick="cerrarModal()" style="background:#25D366;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900;width:100%">Cerrar</button>`;document.getElementById("modalOk").classList.add("show");
 }
 b.textContent="Enviar";b.disabled=false;
}
function cerrarModal(){document.getElementById("modalOk").classList.remove("show");}
cargarAdmin();renderLista();
</script>
</body>
</html>
