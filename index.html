<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela Golazo</title>
<link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMuTFVnhxc_5BG-LHAKYz7agNn4Is2s8l07Snug1XtOfJS9NlWfd_C7OnVQHAR3qSlNQ/exec";
</script>

<div class="contenedor">
  <div class="header">
    <img src="img/logo.png">
    <h1>QUINIELA GOLAZO</h1>
  </div>
  <div class="premio">$700 PRIMER LUGAR | $15 POR QUINIELA</div>

  <div id="lista-partidos"><p class="cargando">Cargando partidos...</p></div>

  <div class="formulario">
    <input id="nombre" placeholder="NOMBRE COMPLETO">
    <input id="telefono" placeholder="WHATSAPP">
    <div class="fila-form">
      <input id="numQuinielas" type="number" value="1" min="1">
      <button class="btn-generar" onclick="generar()">GENERAR</button>
    </div>
    <textarea id="resultado" placeholder="Tus quinielas aparecerán aquí..."></textarea>
    <p id="infoCosto"></p>
    <p id="infoIDs"></p>
    <div class="fila-form">
      <button class="btn-whats" onclick="enviarWhatsApp()">WHATSAPP</button>
      <button class="btn-guardar" onclick="guardarEnBase()">GUARDAR</button>
    </div>
    <p id="statusBase"></p>
  </div>
</div>

<script src="java/main.js"></script>
</body>
</html>
