<!DOCTYPE html>
<html lang="es-mx">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiniela Golazo</title>
<link rel="icon" href="img/logo.png">
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#0a2a4a;color:#fff}
.wrap{max-width:640px;margin:auto;padding:8px;width:100%;overflow:hidden}
/* FONDO TRANSPARENTE */
.top-banner{background:transparent;border:none;border-radius:0;overflow:visible;cursor:pointer;text-align:center;padding:10px 0}
.top-banner img{width:100%;height:auto;display:block;object-fit:contain;max-height:160px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}
.head{display:grid;grid-template-columns:42px 78px 36px 34px 36px 78px 42px;background:#001e2b;border:2px solid #ffee00;border-radius:10px;color:#ffee00;font-weight:900;font-size:9px;padding:6px;text-align:center}
.row{display:grid;grid-template-columns:42px 78px 36px 34px 36px 78px 42px;background:#fff;color:#000;border-bottom:1px solid #ccc;padding:4px;align-items:center}
.row:nth-child(even){background:#e6f2ff}
.btn-p{width:100%;padding:6px;border:2px solid #000;border-radius:6px;font-weight:900;cursor:pointer;background:#fff}
.btn-p.active{background:#ffee00}

/* SOLO BOTONES AGREGADOS - NO TOCA NADA MAS */
.organizer-info,.organizer-infos{margin:8px 0}
.organizer-tags,.organizer-tagss{display:flex;gap:6px}
.organizer-tags a,.organizer-tagss a{flex:1;text-decoration:none}
.tag{border:2px solid #ffee00;background:#0e3a4e;border-radius:12px;padding:8px;text-align:center;font-weight:900;font-size:10px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px}
.tag img{width:28px;height:28px;object-fit:contain}
.tag.facebook{background:#1877F2;border-color:#fff}
.tag.pagar{background:#fff;color:#000}
</style>
</head>
<body>
<div class="wrap">

<div class="top-banner"><img src="img/logo3.png"></div>

<!-- BOTONES AGREGADOS COMO PEDISTE -->
<div class="organizer-info">
  <div class="organizer-tags">
    <a href="https://www.facebook.com/GolazoJuega/" target="_self"><div class="tag facebook"><img src="./img/facebook-icon.svg"><span>Facebook</span></div></a>
    <a href="combinaciones/combinaciones.html" target="_self"><div class="tag combinaciones"><img src="./img/combinaciones.png"><span>Combinaciones</span></div></a>
    <a href="pagos/Pagos.html" target="_self"><div class="tag pagar"><img src="./img/BBVA.png"><span>Pagar</span></div></a>
  </div>
</div>
<div class="organizer-infos">
  <div class="organizer-tagss">
    <a href="cjugar/cjugarinst.html" target="_self"><div class="tag instruciones"><img src="./img/cjugarimg.png"><span>Instrucciones</span></div></a>
    <a href="reglamento/reglamento.html" target="_self"><div class="tag reglamento"><img src="./img/reglamento.png"><span>Reglamento</span></div></a>
    <a href="horarios/horarios.html" target="_self"><div class="tag horarios"><img src="./img/horarios.png"><span>Horarios</span></div></a>
  </div>
</div>
<!-- FIN BOTONES -->

<div id="lista"></div>

</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2MV9K-yXbOEfYTTT8M8OdsCVQuAe7iISrqm6Aw6BipcZxq5PYpVNy9vKmfi-3Gjd1/exec";
let PARTIDOS=[];
function normaliza(n){return n.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"");}
async function cargar(){
let data=null;
try{let r=await fetch(SCRIPT_URL+"?action=obtener_admin");let j=await r.json();if(j&&j.length>0)data=j;}catch(e){}
if(!data){data=JSON.parse(localStorage.getItem("quiniela_nueva")||"null")||[{local:"TOLUCA",visita:"PUEBLA"},{local:"MAZATLAN",visita:"PUMAS"},{local:"PACHUCA",visita:"CRUZ AZUL"},{local:"TIGRES",visita:"LEON"},{local:"ATLAS",visita:"SANTOS"},{local:"JUAREZ",visita:"QUERETARO"},{local:"MONTERREY",visita:"SAN LUIS"},{local:"TIJUANA",visita:"NECAXA"},{local:"GUADALAJARA",visita:"AMERICA"}];}
PARTIDOS=data;render();
}
function render(){
let h=`<div class="head"><div>L</div><div>LOCAL</div><div>E</div><div></div><div>VISITA</div><div>V</div><div></div></div>`;
let html=h;
PARTIDOS.forEach(p=>{
let escL=`img/ESCUDOS/${normaliza(p.local)}.png`;let escR=`img/ESCUDOS/${normaliza(p.visita)}.png`;
html+=`<div class="row"><button class="btn-p">L</button><div>${p.local}</div><img src="${escL}" style="width:28px;height:28px;object-fit:contain"><button class="btn-p">E</button><img src="${escR}" style="width:28px;height:28px;object-fit:contain"><div>${p.visita}</div><button class="btn-p">V</button></div>`;
});
document.getElementById("lista").innerHTML=html;
}
cargar();
</script>
</body>
</html>
