<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela Golazo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial Black, Arial}
body{background:#001525;display:flex;justify-content:center;padding:10px}
.contenedor{width:100%;max-width:750px;background:#001525;border:4px solid #d4ff00;padding:5px}

/* TABLA DE FONDO - ES LA QUE REEMPLAZA TU IMAGEN */
.tabla-fondo{width:100%;border-collapse:collapse;border:2px solid #000}
.tabla-fondo td{border:1px solid #000;text-align:center;padding:2px;font-size:12px;background:#0e3a4f;color:white;height:38px}
.tabla-fondo.col-L,.tabla-fondo.col-E,.tabla-fondo.col-V{width:50px;background:#d9e8f0}
.tabla-fondo.col-nombre{width:170px;background:#0e3a4f;color:white;font-size:11px}
.tabla-fondo.col-escudo{width:45px;background:white;padding:0}
.tabla-fondo.col-escudo img{width:38px;height:28px;object-fit:contain;display:block;margin:0 auto}

/* CAPA DE BOTONES ROJOS POR ENCIMA */
.fila-partido{position:relative}
.fila-partido.botonera{position:absolute;top:0;left:0;width:100%;height:100%;display:grid;grid-template-columns:50px 1fr 45px 50px 45px 1fr 50px;align-items:center;pointer-events:none}
.boton{pointer-events:auto;width:42px;height:30px;margin:0 auto;background:transparent;border:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;font-weight:900}
.boton.active{background:#e50000;color:white;border:2px solid white;border-radius:4px;box-shadow:0 0 5px black}
.info-partido{grid-column:1/-1;background:#d4ff00;color:black;font-family:Arial;font-weight:bold;font-size:10px;text-align:center;padding:2px}

.header{color:#d4ff00;text-align:center;padding:10px;font-size:24px}
.form{margin-top:10px;display:flex;gap:5px;flex-wrap:wrap}
.form input{padding:10px;border-radius:5px;border:2px solid black;flex:1}
</style>
</head>
<body>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMuTFVnhxc_5BG-LHAKYz7agNn4Is2s8l07Snug1XtOfJS9NlWfd_C7OnVQHAR3qSlNQ/exec";
</script>

<div class="contenedor">
  <div class="header">QUINIELA GOLAZO - $700 PRIMER LUGAR</div>
  <div id="lista-partidos">Cargando...</div>

  <div class="form">
    <input id="nombre" placeholder="NOMBRE">
    <input id="telefono" placeholder="WHATSAPP">
    <input id="numQuinielas" type="number" value="1" style="width:60px">
    <button onclick="generar()" style="padding:10px;background:#d4ff00;font-family:Arial Black;border:2px solid black;border-radius:5px">GENERAR</button>
  </div>
  <textarea id="resultado" style="width:100%;height:120px;margin-top:10px"></textarea>
</div>

<script src="java/main.js"></script>
</body>
</html>
