<!DOCTYPE html>
<html lang="es-mx">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ===== TITULO PESTAÑA ===== -->
<title>Panel Central Golazo</title>
<link rel="icon" type="image/png" href="img/logo.png">
<style>
/* ===== RESET ===== - Quita margenes */
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#000e14;color:#fff}

/* ===== LOGIN CONTENEDOR ===== - Centra login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px;background:#000e14}
/* ===== LOGIN CAJA ===== - Cuadro azul con borde amarillo */
.login-box{background:#123f4a;border:3px solid #ffcc00;border-radius:20px;padding:24px 20px;max-width:380px;width:100%;text-align:center}
.login-title{color:#ffdd00;font-size:28px;font-weight:900;letter-spacing:4px;margin:5px 0 18px 0}
.login-box input{width:100%;padding:15px;border:none;border-radius:12px;margin:10px 0;font-size:18px;font-weight:900;text-align:center;background:#fff;color:#5a4a3a}
.btn-login{width:100%;padding:15px;border:none;border-radius:12px;background:#ffdd00;color:#000;font-size:22px;font-weight:900;cursor:pointer;margin-top:6px}
.hidden{display:none}

/* ===== PANEL CENTRAL CONTENEDOR ===== */
.menu-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column}
/* ===== PANEL CENTRAL CAJA ===== */
.menu-box{background:#0e3a4e;border:3px solid #ffee00;border-radius:20px;padding:25px 20px;max-width:420px;width:100%;text-align:center}

/* ===== BASE DE TODOS LOS BOTONES ===== */
.btn-menu{display:block;width:100%;padding:18px;border-radius:14px;font-weight:900;font-size:18px;text-decoration:none;margin:12px 0;border:none}

/* ===== BOTON 1 AMARILLO - IR A ADMIN ===== - Lleva a admin.html */
.btn-admin{background:#ffee00;color:#000}
/* ===== BOTON 2 AZUL - RESULTADOS ===== - Lleva a resultadospartidos.html */
.btn-resultados{background:#00bfff;color:#000}
/* ===== BOTON 3 VERDE - QUINIELA ===== - Lleva a index.html */
.btn-index{background:#00ff66;color:#000}
/* ===== BOTON 4 MORADO - NUEVA QUINIELA ===== - Lleva a nuevaquiniela.html, combina con los 3 anteriores */
.btn-nueva{background:#c084fc;color:#000}
/* ===== BOTON ROJO SALIR ===== */
.btn-salir{background:#ff0033;color:#fff;padding:10px 20px;border-radius:10px;font-weight:900;border:none;cursor:pointer;margin-top:15px}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <img src="img/logo3.png" style="width:100%;max-width:330px;margin:0 auto 8px;display:block">
    <h1 class="login-title">ENTRAR</h1>
    <input id="user" placeholder="USUARIO" value="ADRIAN">
    <input id="pass" type="password" placeholder="PASSWORD">
    <button class="btn-login" id="btnEntrar" onclick="login()">ENTRAR</button>
    <p id="msg" style="color:#ff4444;text-align:center;font-size:12px;margin-top:10px;font-weight:bold"></p>
  </div>
</div>

<div id="menuScreen" class="hidden">
  <div class="menu-wrap">
    <div class="menu-box">
      <!-- ===== LOGO SUPERIOR ===== - logo3.png de img/ -->
      <img src="img/logo3.png" style="width:100%;max-width:280px;margin:0 auto 10px;display:block">
      <h2 style="color:#ffee00;font-weight:900;letter-spacing:2px;margin:0 0 15px">PANEL CENTRAL</h2>
      <p id="who" style="color:#fff;font-weight:900;margin-bottom:18px"></p>

      <a href="admin.html" class="btn-menu btn-admin">⚙️ IR A ADMIN</a>
      <a href="resultadospartidos.html" class="btn-menu btn-resultados">📊 RESULTADOS</a>
      <a href="index.html" class="btn-menu btn-index">🎲 QUINIELA CLIENTE</a>
      <!-- Este funciona en tu compu y en GitHub sin cambiar nada -->
      <a href="nuevaquiniela.html" class="btn-menu btn-nueva">🆕 NUEVA QUINIELA</a>

      <button onclick="logout()" class="btn-salir">Salir</button>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2MV9K-yXbOEfYTTT8M8OdsCVQuAe7iISrqm6Aw6BipcZxq5PYpVNy9vKmfi-3Gjd1/exec";
function mostrar(usuario){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("menuScreen").classList.remove("hidden");
  document.getElementById("who").textContent="Hola "+usuario+" 👋";
}
function logout(){ localStorage.removeItem("sesion_golazo"); location.reload(); }
async function login(){
  let u=document.getElementById("user").value.trim();
  let p=document.getElementById("pass").value.trim();
  let msg=document.getElementById("msg");
  let btn=document.getElementById("btnEntrar");
  if(!u||!p){ msg.textContent="Escribe usuario y pass"; return; }
  btn.textContent="Verificando...";
  msg.textContent="";
  try{
    let r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"validar_login", usuario:u, pass:p})});
    let d=await r.json();
    if(d.ok){ localStorage.setItem("sesion_golazo",JSON.stringify({u:d.usuario})); mostrar(d.usuario); }
    else{ msg.textContent=d.msg; btn.textContent="ENTRAR"; }
  }catch(e){ msg.textContent="❌ Error: "+e.message; btn.textContent="ENTRAR"; }
}
document.getElementById("user").addEventListener("keydown", e=>{ if(e.key==="Enter") login(); });
document.getElementById("pass").addEventListener("keydown", e=>{ if(e.key==="Enter") login(); });
let sesion = localStorage.getItem("sesion_golazo");
if(sesion){ try{ mostrar(JSON.parse(sesion).u); }catch(e){} }
</script>
</body>
</html>
