<!DOCTYPE html>
<html lang="es-mx">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Golazo</title>
<link rel="icon" href="img/logo.png">
<style>
*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#001a26;color:#fff}
.topbar{background:#0a2a4a;padding:12px;text-align:center;border-bottom:3px solid #ffee00}
.card{background:#0e3a4e;border:2px solid #ffee00;border-radius:12px;padding:12px;margin:10px}
input,select{width:100%;padding:8px;border-radius:6px;border:1px solid #ccc;text-align:center;font-weight:bold;text-transform:uppercase}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;cursor:pointer;margin-top:8px}
.btn-g{background:#00ff66;color:#000}.btn-y{background:#ffee00;color:#000}.btn-r{background:#ff4444;color:#fff}
table{width:100%;border-collapse:collapse;background:#fff;color:#000;border-radius:8px;overflow:hidden;font-size:12px}
th{background:#002d3d;color:#ffee00;padding:6px} td{padding:4px;border:1px solid #ddd;text-align:center}
.login{max-width:350px;margin:50px auto}
</style>
</head>
<body>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2MV9K-yXbOEfYTTT8M8OdsCVQuAe7iISrqm6Aw6BipcZxq5PYpVNy9vKmfi-3Gjd1/exec";
</script>

<div class="topbar">
  <img src="img/logo3.png" style="height:40px"><br>
  <b style="color:#ffee00">ADMIN GOLAZO - CUENTA NUEVA</b>
</div>

<!-- LOGIN -->
<div id="loginDiv" class="card login">
  <h3 style="text-align:center;color:#ffee00">ENTRAR</h3>
  <input id="u" placeholder="USUARIO"><br><br>
  <input id="p" type="password" placeholder="PASSWORD"><br>
  <button class="btn btn-y" onclick="login()">ENTRAR</button>
  <p id="loginMsg" style="text-align:center;color:#ff4444"></p>
</div>

<!-- PANEL -->
<div id="panelDiv" style="display:none">

  <div class="card" style="border-color:#00ff66;text-align:center">
    <b style="color:#00ff66">🔍 CONSULTAR PARTIDOS</b>
    <div style="display:flex;gap:8px;margin-top:10px">
      <a href="https://www.flashscore.com.mx/futbol/mexico/liga-mx/calendario/" target="_blank" style="flex:1;background:#00ff66;color:#000;padding:10px;border-radius:8px;font-weight:900;text-decoration:none;font-size:11px">FLASHSCORE</a>
      <a href="https://www.ligamx.net/cancha/calendario" target="_blank" style="flex:1;background:#fff;color:#000;padding:10px;border-radius:8px;font-weight:900;text-decoration:none;font-size:11px">LIGA MX</a>
      <a href="https://www.espn.com.mx/futbol/calendario/_/liga/MEX.1" target="_blank" style="flex:1;background:#007bff;color:#fff;padding:10px;border-radius:8px;font-weight:900;text-decoration:none;font-size:11px">ESPN</a>
    </div>
  </div>

  <div class="card">
    <b style="color:#ffee00">NUEVA QUINIELA</b>
    <button onclick="autoLlenar()" style="width:100%;background:#00ff66;color:#000;padding:12px;border:none;border-radius:10px;font-weight:900;margin:10px 0;cursor:pointer">⚡ LLENAR AUTOMATICAMENTE CON JORNADA ACTUAL</button>
    <p id="autoStatus" style="text-align:center;font-size:12px;color:#ffee00"></p>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>#</th><th>LOCAL</th><th>VISITA</th><th>DIA</th><th>DIA#</th><th>MES</th><th>HORA</th><th>TV</th></tr></thead>
        <tbody id="quinielaBody"></tbody>
      </table>
    </div>
    <button class="btn btn-g" onclick="guardar()">💾 GUARDAR QUINIELA</button>
    <p id="saveMsg" style="text-align:center;color:#00ff66;font-weight:bold"></p>
  </div>

  <div class="card">
    <b style="color:#ffee00">USUARIOS</b>
    <div style="display:flex;gap:5px;margin:10px 0">
      <input id="nu" placeholder="USUARIO NUEVO"><input id="np" placeholder="PASS"><button class="btn btn-y" style="width:120px;margin:0" onclick="alta()">+ ALTA</button>
    </div>
    <div id="listaUsers"></div>
  </div>
</div>

<script>
let quinielaInputs=10;
function crearTabla(){
  let tb=document.getElementById("quinielaBody"); tb.innerHTML="";
  for(let i=0;i<quinielaInputs;i++){
    tb.innerHTML+=`<tr>
      <td>${i+1}</td>
      <td><input id="local${i}"></td>
      <td><input id="visita${i}"></td>
      <td><select id="diaLetra${i}"><option>VIE</option><option>SAB</option><option>DOM</option><option>LUN</option><option>MAR</option><option>MIE</option><option>JUE</option></select></td>
      <td><input id="dia${i}" type="number"></td>
      <td><input id="mes${i}"></td>
      <td><input id="hora${i}" type="time"></td>
      <td><input id="trans${i}"></td>
    </tr>`;
  }
}
crearTabla();

async function login(){
  let u=document.getElementById("u").value, p=document.getElementById("p").value;
  let r=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"login",u,p})});
  let d=await r.json();
  if(d.ok){ document.getElementById("loginDiv").style.display="none"; document.getElementById("panelDiv").style.display="block"; cargar(); listar(); }
  else document.getElementById("loginMsg").textContent="Datos incorrectos";
}
async function cargar(){
  try{
    let r=await fetch(SCRIPT_URL+"?action=obtener_admin"); let data=await r.json();
    data.forEach((q,i)=>{ if(i<quinielaInputs){ document.getElementById("local"+i).value=q.local; document.getElementById("visita"+i).value=q.visita; document.getElementById("diaLetra"+i).value=q.diaLetra; document.getElementById("dia"+i).value=q.dia; document.getElementById("mes"+i).value=q.mes; document.getElementById("hora"+i).value=q.hora; document.getElementById("trans"+i).value=q.trans; } });
  }catch(e){}
}
async function guardar(){
  let quiniela=[];
  for(let i=0;i<quinielaInputs;i++){
    let local=document.getElementById("local"+i).value; if(!local) continue;
    quiniela.push({local:local, visita:document.getElementById("visita"+i).value, diaLetra:document.getElementById("diaLetra"+i).value, dia:document.getElementById("dia"+i).value, mes:document.getElementById("mes"+i).value, hora:document.getElementById("hora"+i).value, trans:document.getElementById("trans"+i).value});
  }
  document.getElementById("saveMsg").textContent="Guardando...";
  let r=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"guardar_admin",quiniela})});
  let d=await r.json(); document.getElementById("saveMsg").textContent=d.ok?"¡Guardado en tu cuenta nueva!":"Error";
}
async function autoLlenar(){
  document.getElementById("autoStatus").textContent="Jalando partidos de ESPN...";
  try{
    let r=await fetch(SCRIPT_URL+"?action=auto_espn"); let data=await r.json();
    if(data.error) throw data.error;
    for(let i=0;i<data.length && i<quinielaInputs;i++){
      document.getElementById("local"+i).value=data[i].local.toUpperCase();
      document.getElementById("visita"+i).value=data[i].visita.toUpperCase();
      document.getElementById("diaLetra"+i).value=data[i].diaLetra;
      document.getElementById("dia"+i).value=data[i].dia;
      document.getElementById("mes"+i).value=data[i].mes;
      document.getElementById("hora"+i).value=data[i].hora;
      document.getElementById("trans"+i).value=data[i].trans;
    }
    document.getElementById("autoStatus").textContent="¡Listo! Se llenaron "+data.length+" partidos. Dale en GUARDAR.";
  }catch(e){ document.getElementById("autoStatus").textContent="Error: "+e; }
}
async function listar(){
  let r=await fetch(SCRIPT_URL+"?action=listar_usuarios"); let data=await r.json();
  let div=document.getElementById("listaUsers"); div.innerHTML="";
  data.forEach(u=>{ div.innerHTML+=`<div style="display:flex;justify-content:space-between;background:#fff;color:#000;padding:6px;margin:4px;border-radius:6px"><b>${u[0]}</b><button onclick="borrar('${u[0]}')" style="background:red;color:#fff;border:none;border-radius:4px;padding:4px 8px">X</button></div>` });
}
async function alta(){
  let u=document.getElementById("nu").value, p=document.getElementById("np").value; if(!u||!p) return;
  await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"alta_usuario",u,p})}); document.getElementById("nu").value=""; document.getElementById("np").value=""; listar();
}
async function borrar(u){ if(!confirm("Borrar "+u+"?")) return; await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"borrar_usuario",u})}); listar(); }
</script>
</body>
</html>
