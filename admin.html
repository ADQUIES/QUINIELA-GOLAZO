<!DOCTYPE html>
<html lang="es-mx">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Golazo</title>
<style>
*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#001a26;color:#fff}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.login-box{background:#fff;color:#000;border-radius:16px;padding:22px;max-width:380px;width:100%}
.login-box input{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;margin:8px 0}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;cursor:pointer}
.btn-blue{background:#007bff;color:#fff}.hidden{display:none}
.topbar{background:#0a2a4a;padding:12px 15px;display:flex;justify-content:space-between;border-bottom:3px solid #ffee00;position:sticky;top:0}
.card{background:#0e3a4e;border:2px solid #ffee00;border-radius:12px;padding:12px;margin:10px}
table{width:100%;border-collapse:collapse;background:#fff;color:#000;border-radius:10px;overflow:hidden}
th{background:#002d3d;color:#ffee00;padding:6px;font-size:10px} td{padding:4px;border:1px solid #ddd;font-size:12px;text-align:center}
td input,td select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;text-transform:uppercase;font-size:14px} /* MAS GRANDE PARA ANDROID */
</style>
</head>
<body>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMuTFVnhxc_5BG-LHAKYz7agNn4Is2s8l07Snug1XtOfJS9NlWfd_C7OnVQHAR3qSlNQ/exec";
</script>

<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <h2 style="text-align:center;color:#002d3d;margin:0">QUINIELA ADMIN</h2>
    <input id="user" placeholder="Usuario" value="ADRIAN" autocapitalize="characters">
    <input id="pass" type="password" placeholder="Contraseña">
    <button class="btn btn-blue" onclick="login()">Ingresar</button>
    <p id="msg" style="color:red;text-align:center;font-size:12px"></p>
  </div>
</div>

<div id="adminScreen" class="hidden">
  <div class="topbar"><b style="color:#ffee00">ADMIN - <span id="who"></span></b><button onclick="logout()" style="background:#ff0033;color:#fff;border:none;padding:6px 12px;border-radius:8px">Salir</button></div>

  <div class="card">
    <b style="color:#ffee00">USUARIOS (ADRIAN + 3)</b>
    <div id="listaUsuarios" style="margin-top:8px"></div>
    <div style="display:flex;gap:6px;margin-top:10px"><input id="newUser" placeholder="Nuevo usuario"><input id="newPass" placeholder="Pass"><button onclick="agregarUsuario()" style="background:#00ff66;border:none;border-radius:8px;padding:0 14px;font-weight:900">+ ALTA</button></div>
    <p style="font-size:10px;color:#aaa">Solo ADRIAN puede dar de alta. Se guardan en tu Google Sheet pestaña USUARIOS, no en el código.</p>
  </div>

  <div class="card">
    <b style="color:#ffee00">NUEVA QUINIELA</b>
    <div style="overflow:auto;margin-top:8px">
    <table><thead><tr><th>#</th><th>LOCAL</th><th>VS</th><th>VISITANTE</th><th>DÍA</th><th>DÍA</th><th>MES</th><th>HORA</th><th>TV</th></tr></thead><tbody id="tablaQuiniela"></tbody></table>
    </div>
    <button class="btn btn-blue" style="margin-top:14px;background:#00ff66;color:#000" onclick="guardarEnSheet()" id="btnGuardar">💾 GUARDAR EN GOOGLE SHEET ADMIN</button>
    <p id="status" style="text-align:center;font-size:13px;margin-top:10px;color:#00ff66;font-weight:bold"></p>
  </div>
</div>

<script>
let usuariosLocal = JSON.parse(localStorage.getItem("usuarios_golazo")||'[{"u":"ADRIAN","p":"1234"}]');
async function login(){
  let u=user.value.trim().toUpperCase(), p=pass.value.trim();
  // Login seguro contra Google Sheet
  try{
    let r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"login",u,p})});
    let j = await r.json();
    if(j.ok){ localStorage.setItem("sesion_golazo",JSON.stringify({u})); mostrarAdmin(); return; }
  }catch(e){}
  // Fallback local por si no tienes aún la pestaña USUARIOS
  let f=usuariosLocal.find(x=>x.u===u&&x.p===p);
  if(f){ localStorage.setItem("sesion_golazo",JSON.stringify(f)); mostrarAdmin(); }
  else msg.textContent="Usuario o contraseña incorrectos";
}
function mostrarAdmin(){ let s=JSON.parse(localStorage.getItem("sesion_golazo")); if(!s)return; loginScreen.classList.add("hidden"); adminScreen.classList.remove("hidden"); who.textContent=s.u; renderUsuarios(); renderTabla(); }
function logout(){ localStorage.removeItem("sesion_golazo"); location.reload(); }
function renderUsuarios(){ let c=document.getElementById("listaUsuarios"); c.innerHTML=""; usuariosLocal.forEach(us=>{ c.innerHTML+=`<div style="background:#002d3d;padding:7px;border-radius:8px;margin:4px 0">👤 ${us.u}</div>`; }); }
async function agregarUsuario(){ if(usuariosLocal.length>=4){ alert("Máximo 4"); return; } let u=newUser.value.trim().toUpperCase(), p=newPass.value.trim(); if(!u||!p){ alert("Llena datos"); return; } try{ await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"alta_usuario",u,p})}); }catch(e){} usuariosLocal.push({u,p}); localStorage.setItem("usuarios_golazo",JSON.stringify(usuariosLocal)); newUser.value=""; newPass.value=""; renderUsuarios(); }

function renderTabla(){
  let tb=document.getElementById("tablaQuiniela"); tb.innerHTML="";
  let def = [
    {local:"PUEBLA",visita:"TOLUCA",diaLetra:"VIERNES",dia:"4",mes:"9",hora:"19:00",trans:"TDN"},
    {local:"JUÁREZ",visita:"PACHUCA",diaLetra:"VIERNES",dia:"4",mes:"9",hora:"21:00",trans:"C5"},
    {local:"SAN LUIS",visita:"GUADALAJARA",diaLetra:"SÁBADO",dia:"5",mes:"9",hora:"17:00",trans:"TDN"},
    {local:"QUERÉTARO",visita:"MONTERREY",diaLetra:"SÁBADO",dia:"5",mes:"9",hora:"17:00",trans:"VIX"},
    {local:"TIGRES",visita:"NECAXA",diaLetra:"SÁBADO",dia:"5",mes:"9",hora:"19:00",trans:"TDN"},
    {local:"AMÉRICA",visita:"TIJUANA",diaLetra:"SÁBADO",dia:"5",mes:"9",hora:"19:05",trans:"C5"},
    {local:"ATLAS",visita:"ATLANTE",diaLetra:"SÁBADO",dia:"5",mes:"9",hora:"21:00",trans:"TDN"},
    {local:"PUMAS",visita:"LEÓN",diaLetra:"DOMINGO",dia:"6",mes:"9",hora:"12:00",trans:"C2"},
    {local:"CRUZ AZUL",visita:"SANTOS",diaLetra:"DOMINGO",dia:"6",mes:"9",hora:"20:00",trans:"C7"}
  ];
  let data = JSON.parse(localStorage.getItem("quiniela_nueva")||"null") || def;
  data.forEach((d,i)=>{ let idx=i+1; tb.innerHTML+=`<tr><td>${idx}</td><td><input id="local${idx}" value="${d.local}"></td><td>VS</td><td><input id="visita${idx}" value="${d.visita}"></td><td><select id="diaLetra${idx}"><option ${d.diaLetra==="VIERNES"?"selected":""}>VIERNES</option><option ${d.diaLetra==="SÁBADO"?"selected":""}>SÁBADO</option><option ${d.diaLetra==="DOMINGO"?"selected":""}>DOMINGO</option></select></td><td><input id="dia${idx}" value="${d.dia}"></td><td><input id="mes${idx}" value="${d.mes}"></td><td><input id="hora${idx}" type="time" value="${d.hora}"></td><td><input id="trans${idx}" value="${d.trans}"></td></tr>`; });
}
function guardarLocal(){ let arr=[]; for(let i=1;i<=9;i++){ arr.push({local:document.getElementById("local"+i).value.toUpperCase(),visita:document.getElementById("visita"+i).value.toUpperCase(),diaLetra:document.getElementById("diaLetra"+i).value,dia:document.getElementById("dia"+i).value,mes:document.getElementById("mes"+i).value,hora:document.getElementById("hora"+i).value,trans:document.getElementById("trans"+i).value.toUpperCase()}); } localStorage.setItem("quiniela_nueva",JSON.stringify(arr)); return arr; }

async function guardarEnSheet(){
  let data=guardarLocal(); let btn=document.getElementById("btnGuardar"); btn.textContent="Guardando...";
  try{ await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"guardar_admin",quiniela:data})}); document.getElementById("status").textContent="✅ Guardado en tu SHEET ADMIN"; btn.textContent="💾 GUARDAR EN GOOGLE SHEET ADMIN"; }catch(e){ document.getElementById("status").textContent="Error: "+e; }
}
if(localStorage.getItem("sesion_golazo")) mostrarAdmin();
</script>
</body>
</html>
