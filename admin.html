<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Quiniela Golazo</title>
<link rel="stylesheet" href="ccs/styles.css">
<style>
body{background:#001525;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial;margin:0}
.box{background:#fff;padding:20px;border-radius:12px;width:90%;max-width:380px;border:3px solid #d4ff00;text-align:center}
.box h2{font-family:Arial Black;margin:0}
.box input{width:100%;padding:12px;margin:10px 0;border:2px solid #000;border-radius:8px;box-sizing:border-box}
.box button{width:100%;padding:12px;background:#000;color:#d4ff00;border:none;border-radius:8px;font-family:Arial Black;cursor:pointer}
#panel{display:none;margin-top:15px;text-align:left}
#panel a{display:block;padding:10px;background:#0a344a;color:#fff;margin:5px 0;border-radius:6px;text-decoration:none;text-align:center}
</style>
</head>
<body>
<div class="box">
  <h2>🔒 ADMIN</h2>
  <p>Ingresa contraseña</p>
  <input type="password" id="pass" placeholder="Contraseña">
  <button onclick="entrar()">ENTRAR</button>
  <p id="error" style="color:red;display:none">Contraseña incorrecta</p>
  
  <div id="panel">
    <h3>Panel Quiniela</h3>
    <a href="index.html">← Volver a Quiniela</a>
    <a href="#" onclick="alert('Aquí irá tu editor de resultados')">📝 Editar Resultados</a>
    <a href="#" onclick="alert('Aquí verás clientes y teléfonos')">📋 Ver Clientes</a>
    <a href="#" onclick="alert('Aquí pagas premios')">💰 Premios</a>
  </div>
</div>

<script>
function entrar(){
  let p = document.getElementById('pass').value;
  if(p === "golazo123"){
    document.getElementById('panel').style.display='block';
    document.getElementById('error').style.display='none';
  } else {
    document.getElementById('error').style.display='block';
  }
}
</script>
</body>
</html>
