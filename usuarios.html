<!DOCTYPE html>
<html lang="es-mx">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ===== TITULO PESTAÑA ===== -->
<title>Usuarios - Golazo</title>
<!-- ===== FAVICON ===== -->
<link rel="icon" type="image/png" href="img/logo.png">
<style>
/* ===== RESET ===== - Quita margenes */
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#000e14;color:#fff}
/* ===== TOPBAR ===== - Barra azul #0a2a4a con borde amarillo */
.topbar{background:#0a2a4a;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #ffee00;position:sticky;top:0;z-index:10}
/* ===== CARD ===== - Caja #0e3a4e borde #ffee00 - Siempre visible, ya sin toggle */
.card{background:#0e3a4e;border:2px solid #ffee00;border-radius:12px;padding:12px;margin:10px}
.card-title{color:#ffee00;font-weight:900;font-size:16px;margin-bottom:10px;text-align:center} /* Titulo fijo */
.user-item{display:flex;justify-content:space-between;align-items:center;background:#002d3d;padding:10px;border-radius:8px;margin:5px 0}
.btn-del{background:#ff0033;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-weight:bold;cursor:pointer}
.msg{padding:8px;border-radius:8px;margin-top:8px;text-align:center;font-weight:bold;font-size:13px}
.msg-ok{background:#00ff66;color:#000}.msg-error{background:#ff0033;color:#fff}
.btn-top{padding:7px 12px;border-radius:8px;font-weight:900;text-decoration:none;font-size:11px;display:inline-block}
input{padding:10px;border-radius:8px;border:none;font-weight:900;text-align:center}
</style>
</head>
<body>
<script>
// ===== SCRIPT_URL ===== - Tu Apps Script
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2MV9K-yXbOEfYTTT8M8OdsCVQuAe7iISrqm6Aw6BipcZxq5PYpVNy9vKmfi-3Gjd1/exec";
// ===== PROTECCION PANEL ===== - Solo entra si viene del panelcentral.html
if(!localStorage.getItem("sesion_golazo")){
  window.location.href="panelcentral.html";
}
</script>

<!-- ===== TOPBAR ===== - Logo + botones -->
<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <img src="img/logo3.png" style="height:38px"> <!-- Logo -->
    <span id="who" style="color:#ffee00;font-weight:900;font-size:12px"></span> <!-- Quien entro -->
  </div>
  <div style="display:flex;gap:6px">
    <a href="index.html" class="btn-top" style="background:#ffee00;color:#000">VER QUINIELA</a>
    <a href="panelcentral.html" class="btn-top" style="background:#00ff66;color:#000">PANEL</a>
  </div>
</div>

<!-- ===== CARD USUARIOS - SIEMPRE VISIBLE, YA SIN BOTON OCULTAR ===== -->
<div class="card">
  <!-- Titulo fijo, ya sin card-header clickeable ni boton toggle -->
  <div class="card-title">👥 USUARIOS (ADRIAN + AYUDANTES)</div>

  <div id="contenidoUsuarios" style="margin-top:10px">
    <div id="listaUsuarios"></div> <!-- Lista de usuarios -->
    <div style="display:flex;gap:6px;margin-top:10px">
      <input id="newUser" placeholder="Nuevo usuario" style="flex:1"> <!-- Input usuario nuevo -->
      <input id="newPass" placeholder="Pass" style="flex:1"> <!-- Input pass nuevo -->
      <button id="btnAlta" onclick="agregarUsuario()" style="background:#00ff66;border:none;border-radius:8px;padding:0 14px;font-weight:900">+ ALTA</button>
    </div>
    <div id="msgUsuarios"></div>
  </div>
</div>

<script>
// ===== QUIEN ENTRO ===== - Muestra nombre del panelcentral
let ses = JSON.parse(localStorage.getItem("sesion_golazo")||"{}");
if(ses.u) document.getElementById("who").textContent = ses.u;

// ===== MENSAJE ===== - Ok verde / error rojo 4 seg
function showMsg(id,t,ok=true){
  let el=document.getElementById(id);
  el.textContent=t;
  el.className="msg "+(ok?"msg-ok":"msg-error");
  setTimeout(()=>{el.textContent="";el.className="";},4000);
}

let usuariosLocal=[]; // Array local usuarios

// ===== CARGAR USUARIOS DESDE HOJA USUARIOS A2:B =====
async function cargarUsuarios(){
  try{
    let r=await fetch(SCRIPT_URL+"?action=listar_usuarios");
    let d=await r.json();
    if(d && d.length>0){
      if(Array.isArray(d[0])){
        usuariosLocal=d.map(x=>({u:x[0],p:x[1]}));
      }else{
        usuariosLocal=d.map(x=>({u:x.usuario||x[0],p:"****"}));
      }
    }
  }catch(e){}
  renderUsuarios();
}

// ===== PINTAR LISTA =====
function renderUsuarios(){
  let c=document.getElementById("listaUsuarios");
  c.innerHTML="";
  usuariosLocal.forEach(us=>{
    let es=us.u==="ADRIAN";
    c.innerHTML+=`<div class="user-item"><span>👤 ${us.u}</span> ${!es?`<button class="btn-del" onclick="borrarUsuario('${us.u}')">X Borrar</button>`:''}</div>`;
  });
}

// ===== AGREGAR USUARIO - PIDE TU PASS DE ADRIAN A2/B2 =====
async function agregarUsuario(){
  let u=document.getElementById("newUser").value.trim().toUpperCase();
  let p=document.getElementById("newPass").value.trim();
  if(!u||!p){showMsg("msgUsuarios","Llena usuario y pass",false);return;}

  let passAdrian = prompt("🔐 Para dar de alta a "+u+", ingresa TU CONTRASEÑA DE ADRIAN:");
  if(!passAdrian) return;

  let btn=document.getElementById("btnAlta");
  btn.disabled=true;
  btn.textContent="Verificando...";
  showMsg("msgUsuarios","Verificando tu pass de ADRIAN",true);

  try{
    let v=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"validar_login", usuario: "ADRIAN", pass: passAdrian})});
    let vd=await v.json();
    if(!vd.ok){
      showMsg("msgUsuarios","❌ No es tu contraseña de ADRIAN",false);
      btn.disabled=false; btn.textContent="+ ALTA"; return;
    }

    btn.textContent="Guardando...";
    let r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"alta_usuario", usuario: u, pass: p})});
    let d=await r.json();
    if(d.ok){
      showMsg("msgUsuarios","✅ "+u+" agregado",true);
      document.getElementById("newUser").value="";
      document.getElementById("newPass").value="";
      cargarUsuarios();
    }else{
      showMsg("msgUsuarios","❌ "+d.msg,false);
    }
  }catch(e){
    showMsg("msgUsuarios","Error: "+e.message,false);
  }
  btn.disabled=false;
  btn.textContent="+ ALTA";
}

// ===== BORRAR USUARIO - PIDE TU PASS DE ADRIAN A2/B2 =====
async function borrarUsuario(n){
  if(n==="ADRIAN"){alert("No puedes borrar a ADRIAN");return;}
  if(!confirm("¿Borrar "+n+"?"))return;

  let passAdrian = prompt("🔐 Para borrar a "+n+", ingresa TU CONTRASEÑA DE ADRIAN:");
  if(!passAdrian) return;

  try{
    let v=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"validar_login", usuario: "ADRIAN", pass: passAdrian})});
    let vd=await v.json();
    if(!vd.ok){alert("❌ No es tu contraseña de ADRIAN");return;}

    await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"borrar_usuario", usuario: n})});
    cargarUsuarios();
  }catch(e){alert("Error: "+e.message);}
}

cargarUsuarios();
</script>
</body>
</html>
