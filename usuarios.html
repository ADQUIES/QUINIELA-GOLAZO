<!DOCTYPE html>
<html lang="es-mx">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Usuarios - Golazo</title>
<link rel="icon" type="image/png" href="img/logo.png">
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#0a2a4a;color:#ffffff;overflow-x:hidden}
/* ===== TOPBAR AJUSTADO - LOGO3.PNG CENTRADO Y RESPONSIVE ===== */
.topbar{
  background:transparent; /* Fondo azul */
  padding:8px 10px; /* Padding mas pequeño para celular */
  display:flex; /* Flex para centrar */
  justify-content:center; /* Centrado horizontal */
  align-items:center; /* Centrado vertical */
  flex-direction:column; /* Logo arriba, nombre abajo en celular */
  gap:4px; /* Espacio entre logo y nombre */
  border-bottom:3px solid #ffee00; /* Borde amarillo */
  position:sticky; /* Se queda arriba al scrollear */
  top:0; /* Pegado arriba */
  z-index:10;
}
.topbar img{
  height:34px; /* Altura logo ajustada para celular - mas pequeña */
  width:auto; /* Ancho automatico */
  max-width:80%; /* No se sale en celular */
  object-fit:contain; /* No se deforma */
}
@media(min-width:400px){ /* En pantalla mas grande que 400px */
 .topbar{flex-direction:row; padding:10px 12px} /* Logo y nombre en fila */
 .topbar img{height:38px} /* Logo un poco mas grande en PC */
}
.card{background:transparent;border:2px solid #ffee00;border-radius:12px;padding:12px;margin:10px auto;max-width:420px;width:calc(100% - 20px)}
.card-title{color:#ffee00;font-weight:900;font-size:15px;margin-bottom:10px;text-align:center}
.user-item{display:flex;justify-content:space-between;align-items:center;background:#002d3d;padding:10px;border-radius:8px;margin:5px 0;font-size:14px}
.btn-del{background:#ff0033;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:12px}
.msg{padding:8px;border-radius:8px;margin-top:8px;text-align:center;font-weight:bold;font-size:12px}
.msg-ok{background:#00ff66;color:#000}.msg-error{background:#ff0033;color:#fff}
input{padding:12px;border-radius:8px;border:none;font-weight:900;text-align:center;width:100%;font-size:14px}
.inputs-row{display:flex;gap:6px;margin-top:10px}
.inputs-row input{flex:1;min-width:0}
.bottom-bar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:14px 10px;margin:10px auto;max-width:420px;width:calc(100% - 20px);background:transparent;border:2px solid #ffee00;border-radius:12px}
.btn-bottom{flex:1;min-width:90px;max-width:120px;padding:14px 6px;border-radius:10px;font-weight:900;font-size:12px;border:none;cursor:pointer;text-decoration:none;text-align:center}
</style>
</head>
<body>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2MV9K-yXbOEfYTTT8M8OdsCVQuAe7iISrqm6Aw6BipcZxq5PYpVNy9vKmfi-3Gjd1/exec";
if(!localStorage.getItem("sesion_golazo")){
  window.location.href="panelcentral.html";
}
</script>

<!-- ===== TOPBAR AJUSTADO: LOGO3.PNG CENTRADO Y RESPONSIVE - YA NO SE SALE EN CELULAR ===== -->
<div class="topbar">
  <img src="img/logo3.png" alt="Golazo"> <!-- Logo3.png centrado, 34px en celular, 38px en PC -->
  <span id="who" style="color:#ffee00;font-weight:900;font-size:11px"></span> <!-- Nombre abajo del logo en celular -->
</div>

<div class="card">
  <div class="card-title">👥 USUARIOS (ADRIAN + 3 USUARIOS)</div>
  <div id="listaUsuarios"></div>
  <div class="inputs-row">
    <input id="newUser" placeholder="Nuevo usuario">
    <input id="newPass" placeholder="Pass">
  </div>
  <div id="msgUsuarios"></div>
</div>

<div class="bottom-bar">
  <a href="index.html" class="btn-bottom" style="background:#ffee00;color:#000">VER QUINIELA</a>
  <a href="panelcentral.html" class="btn-bottom" style="background:#00bfff;color:#000">PANEL</a>
  <button id="btnAlta" onclick="agregarUsuario()" class="btn-bottom" style="background:#00ff66;color:#000">+ ALTA</button>
</div>

<script>
let ses = JSON.parse(localStorage.getItem("sesion_golazo")||"{}");
if(ses.u) document.getElementById("who").textContent = ses.u;
function showMsg(id,t,ok=true){let el=document.getElementById(id);el.textContent=t;el.className="msg "+(ok?"msg-ok":"msg-error");setTimeout(()=>{el.textContent="";el.className="";},4000);}
let usuariosLocal=[];
async function cargarUsuarios(){
  try{
    let r=await fetch(SCRIPT_URL+"?action=listar_usuarios");
    let d=await r.json();
    if(d && d.length>0){
      if(Array.isArray(d[0])){usuariosLocal=d.map(x=>({u:x[0],p:x[1]}));}
      else{usuariosLocal=d.map(x=>({u:x.usuario||x[0],p:"****"}));}
    }
  }catch(e){}
  renderUsuarios();
}
function renderUsuarios(){
  let c=document.getElementById("listaUsuarios");c.innerHTML="";
  usuariosLocal.forEach(us=>{
    let es=us.u==="ADRIAN";
    c.innerHTML+=`<div class="user-item"><span>👤 ${us.u}</span> ${!es?`<button class="btn-del" onclick="borrarUsuario('${us.u}')">X Borrar</button>`:''}</div>`;
  });
}
async function agregarUsuario(){
  let u=document.getElementById("newUser").value.trim().toUpperCase();
  let p=document.getElementById("newPass").value.trim();
  if(!u||!p){showMsg("msgUsuarios","Llena usuario y pass",false);return;}
  let passAdrian = prompt("🔐 Para dar de alta a "+u+", ingresa TU CONTRASEÑA DE ADRIAN:");
  if(!passAdrian) return;
  let btn=document.getElementById("btnAlta");btn.disabled=true;btn.textContent="Verificando...";
  showMsg("msgUsuarios","Verificando tu pass de ADRIAN",true);
  try{
    let v=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"validar_login", usuario: "ADRIAN", pass: passAdrian})});
    let vd=await v.json();
    if(!vd.ok){showMsg("msgUsuarios","❌ No es tu contraseña de ADRIAN",false);btn.disabled=false;btn.textContent="+ ALTA";return;}
    btn.textContent="Guardando...";
    let r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"alta_usuario", usuario: u, pass: p})});
    let d=await r.json();
    if(d.ok){showMsg("msgUsuarios","✅ "+u+" agregado",true);document.getElementById("newUser").value="";document.getElementById("newPass").value="";cargarUsuarios();}
    else{showMsg("msgUsuarios","❌ "+d.msg,false);}
  }catch(e){showMsg("msgUsuarios","Error: "+e.message,false);}
  btn.disabled=false;btn.textContent="+ ALTA";
}
async function borrarUsuario(n){
  if(n==="ADRIAN"){alert("No puedes borrar a ADRIAN");return;}
  if(!confirm("¿Borrar "+n+"?"))return;
  let passAdrian = prompt("🔐 Para borrar a "+n+", ingresa TU CONTRASEÑA DE ADRIAN:");
  if(!passAdrian) return;
  try{
    let v=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"validar_login", usuario: "ADRIAN", pass: passAdrian})});
    let vd=await v.json();
    if(!vd.ok){alert("❌ No es tu contraseña de ADRIAN");return;}
    await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"borrar_usuario", usuario: n})});
    cargarUsuarios();
  }catch(e){alert("Error: "+e.message);}
}
cargarUsuarios();
</script>
</body>
</html>
