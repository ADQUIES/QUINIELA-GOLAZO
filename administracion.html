<!DOCTYPE html>
<html lang="es-mx">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administracion Golazo</title>
<link rel="icon" type="image/png" href="img/logo.png">
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#000e14;color:#fff}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px;background:#000e14}
.login-box{background:#123f4a;border:3px solid #ffcc00;border-radius:20px;padding:24px 20px;max-width:380px;width:100%;box-shadow:0 10px 30px #0008;text-align:center}
.login-title{color:#ffdd00;font-size:28px;font-weight:900;letter-spacing:4px;margin:5px 0 18px 0}
.login-box input{width:100%;padding:15px;border:none;border-radius:12px;margin:10px 0;font-size:18px;font-weight:900;text-align:center;background:#fff;color:#5a4a3a}
.btn-login{width:100%;padding:15px;border:none;border-radius:12px;background:#ffdd00;color:#000;font-size:22px;font-weight:900;cursor:pointer;margin-top:6px}
.hidden{display:none}
.menu-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column}
.menu-box{background:#0e3a4e;border:3px solid #ffee00;border-radius:20px;padding:25px 20px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px #0008}
.btn-menu{display:block;width:100%;padding:18px;border-radius:14px;font-weight:900;font-size:18px;text-decoration:none;margin:12px 0;cursor:pointer;border:none}
.btn-admin{background:#ffee00;color:#000}
.btn-resultados{background:#00bfff;color:#000}
.btn-index{background:#00ff66;color:#000}
.btn-salir{background:#ff0033;color:#fff;padding:10px 20px;border-radius:10px;font-weight:900;border:none;cursor:pointer;margin-top:15px}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <img src="img/logo3.png" style="width:100%;max-width:330px;margin:0 auto 8px;display:block;filter:drop-shadow(0 4px 8px #000)">
    <h1 class="login-title">ENTRAR</h1>
    <input id="user" placeholder="USUARIO" value="ADRIAN">
    <input id="pass" type="password" placeholder="PASSWORD">
    <button class="btn-login" onclick="login()">ENTRAR</button>
    <p id="msg" style="color:#ff4444;text-align:center;font-size:12px;margin-top:10px;font-weight:bold"></p>
  </div>
</div>

<div id="menuScreen" class="hidden">
  <div class="menu-wrap">
    <div class="menu-box">
      <img src="img/logo3.png" style="width:100%;max-width:280px;margin:0 auto 10px;display:block">
      <h2 style="color:#ffee00;font-weight:900;letter-spacing:2px;margin:0 0 15px">PANEL CENTRAL</h2>
      <p id="who" style="color:#fff;font-weight:900;margin-bottom:18px"></p>

      <a href="admin.html" class="btn-menu btn-admin">⚙️ IR A ADMIN<br><span style="font-size:12px;font-weight:400">Crear quiniela / Usuarios</span></a>
      <a href="resultadospartidos.html" class="btn-menu btn-resultados">📊 RESULTADOS<br><span style="font-size:12px;font-weight:400">Ingresar Resultados</span></a>
      <a href="index.html" class="btn-menu btn-index">🎲 IR A QUINIELA<br><span style="font-size:12px;font-weight:400">Ver página de clientes</span></a>

      <button onclick="logout()" class="btn-salir">Salir</button>
    </div>
  </div>
</div>

<script>
function mostrar(){ 
  let s=JSON.parse(localStorage.getItem("sesion_golazo")); 
  if(!s) return;
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("menuScreen").classList.remove("hidden");
  document.getElementById("who").textContent="Hola "+s.u+" 👋";
}
function logout(){ localStorage.removeItem("sesion_golazo"); location.reload(); }
function login(){
  let u=document.getElementById("user").value.trim().toUpperCase();
  let p=document.getElementById("pass").value.trim();
  if(!u||!p){ document.getElementById("msg").textContent="Escribe usuario y pass"; return; }
  localStorage.setItem("sesion_golazo",JSON.stringify({u:u}));
  mostrar();
}
if(localStorage.getItem("sesion_golazo")) mostrar();
</script>
</body>
</html>
